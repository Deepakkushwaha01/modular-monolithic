services:

  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: app-redis
    restart: always

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --user
      - default
      - off
      - --user
      - ${REDIS_USER}
      - on
      - ">${REDIS_PASSWORD}"
      - "~*"
      - "&*"
      - "+@all"


    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: app-redisinsight
    restart: always

    ports:
      - "5540:5540"
    volumes:
      - redis_insight:/data
    depends_on:
      - redis
    networks:
      - app-network


volumes:
  postgres_data:
  redis_data:
  redis_insight:

networks:
  app-network:
    driver: bridge